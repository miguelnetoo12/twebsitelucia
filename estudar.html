<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudar · Ponto de Partida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== ESTILO (CSS) ===== */
:root {
  /* Layout: login em tela dividida; dentro do app, coluna de 1100px com cabeçalho fixo e páginas trocadas pelo # */
  --papel: #f4f5f0;
  --superficie: #ffffff;
  --tinta: #14213d;
  --texto-suave: #4a5468;
  --lapis: #f2b705;
  --alerta: #c8452c;
  --verde: #2e7d5b;
  --linha: #d9dccf;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-corpo: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --raio: 10px;
  --max: 1100px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #10141f; --superficie: #181e2c; --tinta: #eef0e8; --texto-suave: #a9b0c0;
    --lapis: #f5c430; --alerta: #ef7a5f; --verde: #5cc196; --linha: #2a3244;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #10141f; --superficie: #181e2c; --tinta: #eef0e8; --texto-suave: #a9b0c0;
  --lapis: #f5c430; --alerta: #ef7a5f; --verde: #5cc196; --linha: #2a3244;
  color-scheme: dark;
}
/* Modo fácil: tudo maior */
html.facil { font-size: 122%; }
html.facil .texto-ajuda { display: block; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--papel); color: var(--tinta); font-family: var(--font-corpo); font-size: 1.0625rem; line-height: 1.6; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); font-weight: 800; }
h2 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); font-weight: 800; }
h3 { font-size: 1.2rem; font-weight: 700; }
p { max-width: 65ch; }
a { color: inherit; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--lapis); outline-offset: 3px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.container { width: min(var(--max), 100% - 32px); margin-inline: auto; }
.sobretitulo { font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-suave); display: block; margin-bottom: 10px; }
.suave { color: var(--texto-suave); }
[hidden] { display: none !important; }
.texto-ajuda { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 999px; font-weight: 600; text-decoration: none; border: 2px solid var(--tinta); cursor: pointer; }
.btn-primario { background: var(--tinta); color: var(--papel); }
.btn-secundario { background: transparent; color: var(--tinta); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.link-btn { background: none; border: none; color: var(--tinta); font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }
.ouvir { display: inline-flex; align-items: center; gap: 6px; background: var(--superficie); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 14px; font-size: .88rem; font-weight: 600; color: var(--tinta); cursor: pointer; }
.ouvir:hover { border-color: var(--tinta); }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ======================= LOGIN ======================= */
.login { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.login-marca { background: #14213d; color: #f4f5f0; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.login-marca .logo { color: #f4f5f0; }
.login-marca h1 { color: #f4f5f0; max-width: 14ch; }
.login-marca h1 mark { background: linear-gradient(transparent 60%, #f2b705 60%); color: inherit; padding-inline: 4px; }
.login-marca p { color: #c9cfdb; margin-top: 18px; }
.recursos-login { display: grid; gap: 10px; color: #c9cfdb; font-size: .95rem; list-style: none; }
.recursos-login li { display: flex; gap: 10px; }
.recursos-login b { color: #f2b705; }
.login-form-area { display: grid; place-items: center; padding: 48px 24px; }
.login-caixa { width: min(420px, 100%); display: grid; gap: 20px; }
.login-caixa h2 { font-size: 2rem; }
.campo { display: grid; gap: 6px; }
.campo label { font-weight: 600; font-size: .92rem; }
.campo input { font: inherit; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--linha); background: var(--superficie); color: var(--tinta); }
.campo input:focus { outline: 2px solid var(--lapis); border-color: var(--tinta); }
.erro { color: var(--alerta); font-size: .9rem; min-height: 1.4em; }
.form-grade { display: grid; gap: 16px; }
.separador { display: flex; align-items: center; gap: 12px; color: var(--texto-suave); font-size: .85rem; }
.separador::before, .separador::after { content: ""; flex: 1; height: 1px; background: var(--linha); }
.aviso-prototipo { font-size: .8rem; color: var(--texto-suave); background: var(--superficie); border: 1px dashed var(--linha); border-radius: 8px; padding: 10px 12px; }
.btn-grande { padding: 16px 22px; font-size: 1.05rem; }

/* ======================= APP ======================= */
.logo { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.logo-marca { width: 22px; height: 22px; background: var(--lapis); border-radius: 50%; border: 3px solid currentColor; flex: none; }

header.topo { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--papel) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); }
.topo .container { width: min(1440px, 100% - 32px); }
.nav { display: flex; align-items: center; justify-content: space-between; min-height: 64px; gap: 12px; }
.nav-links { display: flex; align-items: center; gap: 2px; list-style: none; }
.nav-links a { display: flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 500; font-size: .92rem; padding: 7px 12px; border-radius: 999px; color: var(--texto-suave); white-space: nowrap; }
.nav-links a:hover { color: var(--tinta); }
.nav-links a[aria-current="page"] { background: var(--tinta); color: var(--papel); }
.icone { font-size: 1.05em; line-height: 1; }
.usuario { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--lapis); color: #14213d; display: grid; place-items: center; font-weight: 700; flex: none; }
.ferramentas { display: flex; gap: 8px; }
.ferramenta { background: var(--superficie); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 600; cursor: pointer; color: var(--tinta); white-space: nowrap; }
.ferramenta[aria-pressed="true"] { background: var(--lapis); border-color: var(--lapis); color: #14213d; }
.menu-btn { display: none; background: none; border: 1px solid var(--linha); border-radius: 8px; padding: 6px 12px; color: var(--tinta); cursor: pointer; }

.pagina { padding-block: 44px 72px; }
.cabeca-pagina { display: grid; gap: 12px; margin-bottom: 32px; }
.bloco-secao { margin-top: 56px; }
.bloco-secao > h2 { margin-bottom: 8px; }
.bloco-secao > p.suave { margin-bottom: 24px; }
.painel { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 24px; }

/* ---- Tela inicial ---- */
.boas-vindas { display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; align-items: stretch; }
.boas-vindas p { margin-top: 16px; font-size: 1.1rem; }
.dica-dia { background: var(--lapis); color: #14213d; border-radius: var(--raio); padding: 24px; display: grid; gap: 10px; align-content: start; }
.dica-dia .sobretitulo { color: #14213d; opacity: .75; margin: 0; }
.dica-dia h3 { font-size: 1.3rem; }
.dica-dia .link-btn { color: #14213d; }
.atalhos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 36px; }
.atalho { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 22px; text-decoration: none; display: grid; gap: 6px; align-content: start; }
.atalho:hover { border-color: var(--tinta); }
.atalho .icone-grande { font-size: 1.8rem; line-height: 1; }
.atalho .suave { font-size: .93rem; }
.progresso-grade { display: grid; grid-template-columns: 1fr 1.4fr; gap: 28px; align-items: center; }
.progresso-total strong { font-family: var(--font-display); font-size: 3rem; line-height: 1; display: block; }
.barras { display: grid; gap: 12px; }
.barra-linha { display: grid; grid-template-columns: 110px 1fr 64px; align-items: center; gap: 12px; font-size: .92rem; }
.barra-trilho { height: 16px; background: var(--papel); border-radius: 999px; overflow: hidden; }
.barra-valor { height: 100%; background: var(--tinta); border-radius: 999px; transition: width .5s ease; }
.barra-num { text-align: right; font-weight: 600; }
.faixa-numeros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 26px; background: #14213d; color: #f4f5f0; border-radius: var(--raio); }
.faixa-numeros div { border-top: 3px solid #f2b705; padding-top: 12px; }
.faixa-numeros strong { font-family: var(--font-display); font-size: 2rem; line-height: 1; display: block; }
.faixa-numeros span { display: block; margin-top: 8px; font-size: .88rem; color: #c9cfdb; }
.fonte { font-size: .8rem; color: var(--texto-suave); margin-top: 10px; }

/* ---- Estrutura das páginas ---- */
main.pagina { min-height: 60vh; }
.cabeca-pagina h1 { font-size: clamp(1.9rem, 4.2vw, 2.8rem); }
.titulo-secao { font-size: clamp(1.25rem, 2.6vw, 1.6rem); margin-bottom: 14px; }
.abas-pagina { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--linha); margin-bottom: 28px; }
.aba-pagina { font: inherit; font-weight: 600; font-size: .95rem; padding: 10px 16px; border: none; background: none; color: var(--texto-suave); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.aba-pagina:hover { color: var(--tinta); }
.aba-pagina[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--lapis); }
.atalhos-icones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
.atalhos-icones a { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--raio); border: 1px solid var(--linha); background: var(--superficie); text-decoration: none; font-weight: 600; font-size: .95rem; }
.atalhos-icones a:hover { border-color: var(--tinta); }
.atalhos-icones span { font-size: 1.4rem; line-height: 1; }
.avatar-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--lapis); color: #14213d; display: grid; place-items: center; font-size: .75rem; }
.selo[aria-current="page"] { outline: 2px solid var(--lapis); outline-offset: 2px; }
.ferramenta { min-width: 38px; }
.destaques-estudo { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 36px; }
.cartao-bloco.destaque-claro { background: var(--lapis); border-color: var(--lapis); color: #14213d; }
.cartao-bloco.destaque-claro .meta, .cartao-bloco.destaque-claro .sobretitulo { color: #14213d; opacity: .8; }
.cartao-bloco.feito { background: color-mix(in srgb, var(--verde) 7%, var(--superficie)); }
.nivel-resumo { display: grid; gap: 4px; align-content: start; }
.medalhas-mini { display: flex; gap: 8px; font-size: 1.7rem; margin: 8px 0; flex-wrap: wrap; }
.nivel-resumo .link-btn { justify-self: start; margin-top: 6px; }
.perfil-topo { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
.perfil-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--lapis); color: #14213d; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 2rem; flex: none; }
.perfil-resumo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.resumo-item { display: grid; gap: 2px; border-top: 3px solid var(--lapis); padding-top: 10px; }
.resumo-item strong { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; }
.resumo-item span { font-size: .88rem; color: var(--texto-suave); }
.perfil-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.medalhas-grandes { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.medalhas-grandes .medalha { padding: 16px 8px; }
.medalhas-grandes .medalha-icone { font-size: 2.2rem; }
.medalhas-grandes .medalha-nome { font-size: .85rem; }
.medalhas-grandes .medalha-desc { font-size: .75rem; }
.lista-salvas { list-style: none; display: grid; gap: 10px; }
.lista-salvas li { display: grid; gap: 2px; padding-left: 12px; border-left: 3px solid var(--lapis); font-size: .93rem; }
.grade-momentos.compacta { grid-template-columns: 1fr 1fr; margin-top: 8px; }
.grade-momentos.compacta .momento { padding: 12px; font-size: .9rem; }
.grade-momentos.compacta .momento-icone { font-size: 1.4rem; }
.momento.atual { border-color: var(--lapis); background: color-mix(in srgb, var(--lapis) 18%, var(--superficie)); }
.conta .confirmar-apagar { margin-top: 16px; padding: 16px; border-radius: 8px; border-left: 4px solid var(--alerta); background: var(--papel); display: grid; gap: 12px; }
.btn-perigo { background: var(--alerta); border-color: var(--alerta); color: #fff; }
.continuar { width: min(420px, 100%); display: grid; gap: 12px; margin-bottom: 18px; border-left: 4px solid var(--lapis); }
.login-form-area { align-content: center; }
footer#rodape { border-top: 1px solid var(--linha); padding-block: 28px; font-size: .85rem; color: var(--texto-suave); margin-top: 24px; }
.rodape-grade { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

.grade-graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; margin-top: 16px; align-items: start; }
.grade-graficos h3 { margin-bottom: 2px; }
.grafico-sub { font-size: .85rem; margin-bottom: 12px; }
.grade-graficos .barra-linha { grid-template-columns: 130px 1fr 54px; }

/* ---- Engajamento ---- */
.selo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: var(--tinta); color: var(--papel); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
.selo-xp { color: var(--lapis); }
.selo-fogo { display: inline-flex; gap: 2px; }
.selo.pulsa { animation: pulsa .5s ease; }
@keyframes pulsa { 50% { transform: scale(1.12); } }
.trilha { display: block; }
.grade-momentos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
.momento { display: grid; gap: 10px; justify-items: start; text-align: left; padding: 18px; border-radius: var(--raio); border: 2px solid var(--linha); background: var(--papel); color: var(--tinta); font-weight: 600; cursor: pointer; }
.momento:hover { border-color: var(--tinta); }
.momento-icone { font-size: 2rem; line-height: 1; }
.trilha-topo { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
.trilha-topo h2 { font-size: clamp(1.3rem, 3vw, 1.8rem); margin: 6px 0; }
.trilha-progresso { text-align: right; display: grid; }
.trilha-progresso strong { font-family: var(--font-display); font-size: 2.4rem; line-height: 1; }
.passos { list-style: none; display: grid; gap: 8px; counter-reset: passo; }
.passos li { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--papel); }
.passos .marca { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--linha); display: grid; place-items: center; font-weight: 700; }
.passos li.feito .marca { background: var(--verde); border-color: var(--verde); color: #fff; }
.passos li.feito .passo-texto { color: var(--texto-suave); text-decoration: line-through; }
.passo-ir { padding: 6px 16px; font-size: .9rem; }
.passo-ok { font-size: .85rem; font-weight: 600; color: var(--verde); }
.trilha-fim { margin-top: 14px; font-weight: 600; }
.linha-engaja { display: grid; grid-template-columns: 1fr 1.6fr; gap: 18px; align-items: stretch; }
.desafio-dia { display: grid; gap: 10px; align-content: start; background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.desafio-dia .sobretitulo, .desafio-dia .suave { color: color-mix(in srgb, var(--papel) 75%, transparent); }
.desafio-dia h3 { font-size: 1.5rem; }
.desafio-dia .btn { justify-self: start; }
.desafio-dia .btn-primario { background: var(--lapis); border-color: var(--lapis); color: #14213d; }
.desafio-dia .btn-secundario { color: var(--papel); border-color: var(--papel); }
.sequencia { display: flex; align-items: center; gap: 10px; font-size: 1rem; }
.fogo { font-size: 2rem; line-height: 1; }
.nivel-topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.xp-grande { font-family: var(--font-display); font-size: 1.8rem; color: var(--tinta); }
.medalhas { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.medalha { display: grid; justify-items: center; text-align: center; gap: 2px; padding: 10px 4px; border-radius: 8px; background: var(--papel); opacity: .55; }
.medalha.ganha { opacity: 1; background: color-mix(in srgb, var(--lapis) 22%, var(--superficie)); }
.medalha-icone { font-size: 1.6rem; line-height: 1.1; }
.medalha-nome { font-size: .75rem; font-weight: 700; line-height: 1.2; }
.medalha-desc { font-size: .68rem; color: var(--texto-suave); line-height: 1.25; }
.grade-mitos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.mito { position: relative; min-height: 190px; border: none; padding: 0; background: none; cursor: pointer; perspective: 900px; text-align: left; color: var(--tinta); }
.mito-frente, .mito-verso { position: absolute; inset: 0; display: grid; align-content: center; gap: 10px; padding: 22px; border-radius: var(--raio); backface-visibility: hidden; transition: transform .5s ease; font-size: 1rem; }
.mito-frente { background: var(--superficie); border: 1px solid var(--linha); font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
.mito-aspas { font-size: 3rem; line-height: .5; color: var(--lapis); }
.mito-toque { font-family: var(--font-corpo); font-size: .8rem; font-weight: 600; color: var(--texto-suave); }
.mito-verso { background: var(--tinta); color: var(--papel); transform: rotateY(180deg); font-size: .95rem; }
.mito.virado .mito-frente { transform: rotateY(180deg); }
.mito.virado .mito-verso { transform: rotateY(360deg); }
.selo-mito { justify-self: start; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; padding: 2px 14px; border-radius: 999px; }
.mito-falso { background: var(--alerta); color: #fff; }
.mito-verdade { background: var(--verde); color: #fff; }
.combo { margin-top: 12px; font-weight: 700; font-size: 1.1rem; color: var(--alerta); }
.desafiar { margin-top: 28px; padding: 20px; border-radius: var(--raio); background: var(--papel); display: grid; gap: 14px; }
.btn-whats { background: #1f8f4e; border-color: #1f8f4e; color: #fff; }
.confete { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

/* ---- Redação ---- */
.grade-temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tema { display: grid; gap: 10px; align-content: start; text-align: left; padding: 18px; border-radius: var(--raio); border: 1px solid var(--linha); border-left: 5px solid var(--lapis); background: var(--superficie); color: var(--tinta); cursor: pointer; }
.tema:hover { border-color: var(--tinta); border-left-color: var(--lapis); }
.tema .tag { justify-self: start; }
.tema-titulo { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
.tema-meta { font-size: .82rem; color: var(--texto-suave); }
.historico { list-style: none; display: grid; gap: 6px; }
.historico li { display: grid; grid-template-columns: 1fr auto 60px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--linha); font-size: .92rem; }
.historico li b { text-align: right; font-family: var(--font-display); font-size: 1.1rem; }
#historico-redacoes:empty { display: none; }
.editor-grade { display: grid; grid-template-columns: 1fr 1.4fr; gap: 18px; margin-top: 14px; align-items: start; }
.apoio-caixa { display: grid; gap: 12px; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }

<script>
/* ===== js/comum.js ===== */
/* =========================================================
   COMUM: usado por todas as páginas (menos o login)
   - atalhos de código, armazenamento, sessão do usuário
   - cabeçalho, rodapé, Modo fácil e leitura em voz alta
   - perfil: XP, níveis, medalhas, trilha e sequência de dias
   ========================================================= */

/* ---------- Atalhos ---------- */
const $ = id => document.getElementById(id);
const embaralhar = arr => arr.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const hojeISO = () => new Date().toISOString().slice(0, 10);

const AREAS = {
  mat: { nome: "Matemática", cor: "#2f6fdf" },
  lin: { nome: "Linguagens", cor: "#c8452c" },
  hum: { nome: "Humanas", cor: "#8a5cc7" },
  nat: { nome: "Natureza", cor: "#2e7d5b" },
  inf: { nome: "Informática", cor: "#0f8b8d" }
};

/* ---------- Armazenamento no navegador (com proteção se não existir) ---------- */
function ler(chave, padrao) {
  try { const v = localStorage.getItem(chave); return v === null ? padrao : JSON.parse(v); } catch (e) { return padrao; }
}
function gravar(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) { /* segue sem salvar */ }
}

/* ---------- Sessão ---------- */
const CHAVE_USUARIO = "pontoDePartida:usuario";
let usuario = ler(CHAVE_USUARIO, null);
const PAGINA = document.body.dataset.pagina;

function sair() {
  try { localStorage.removeItem(CHAVE_USUARIO); speechSynthesis.cancel(); } catch (e) {}
  location.href = "index.html";
}
/* Sem login, volta para a tela de entrada. Se o navegador não guarda dados, entra como visitante. */
if (PAGINA !== "login" && !usuario) {
  let temArmazenamento = true;
  try { localStorage.setItem("teste", "1"); localStorage.removeItem("teste"); } catch (e) { temArmazenamento = false; }
  if (temArmazenamento) location.replace("index.html");
  else usuario = "Visitante";
}

/* ---------- Avisos, voz e comemoração ---------- */
document.body.insertAdjacentHTML("beforeend",
  `<div class="aviso" id="aviso" role="status" hidden></div><canvas class="confete" id="confete" aria-hidden="true" hidden></canvas>`);

function avisar(texto) {
  const el = $("aviso");
  el.textContent = texto; el.hidden = false;
  clearTimeout(avisar.t); avisar.t = setTimeout(() => el.hidden = true, 3500);
}
function falar(texto) {
  try {
    if (!("speechSynthesis" in window)) return avisar("Seu navegador não tem leitura em voz alta.");
    speechSynthesis.cancel();
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = "pt-BR"; fala.rate = 0.9;
    const voz = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("pt"));
    if (voz) fala.voice = voz;
    speechSynthesis.speak(fala);
  } catch (e) { avisar("Não foi possível tocar o áudio neste navegador."); }
}
/* Qualquer botão com data-falar="texto" lê o texto em voz alta */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-falar]");
  if (b) falar(b.dataset.falar);
});

function celebrar(texto) {
  avisar(texto);
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const tela = $("confete"), ctx = tela.getContext("2d");
  tela.width = innerWidth; tela.height = innerHeight; tela.hidden = false;
  const cores = ["#f2b705", "#14213d", "#c8452c", "#2e7d5b", "#2f6fdf", "#8a5cc7"];
  const pedacos = Array.from({ length: 110 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.35,
    vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 11 - 4,
    t: Math.random() * 6 + 4, r: Math.random() * Math.PI, cor: cores[Math.floor(Math.random() * cores.length)]
  }));
  const inicio = performance.now();
  (function quadro(agora) {
    ctx.clearRect(0, 0, tela.width, tela.height);
    pedacos.forEach(p => {
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.15;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.cor;
      ctx.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2); ctx.restore();
    });
    if (agora - inicio < 1800) requestAnimationFrame(quadro);
    else { ctx.clearRect(0, 0, tela.width, tela.height); tela.hidden = true; }
  })(inicio);
}

/* ---------- Perfil: progresso salvo do usuário ---------- */
const NIVEIS = [
  { min: 0, nome: "Recomeço" }, { min: 100, nome: "Aprendiz" }, { min: 300, nome: "Estudante" },
  { min: 600, nome: "Dedicado" }, { min: 1000, nome: "Rumo à faculdade" }, { min: 1600, nome: "Pronto para o ENEM" }
];
const MEDALHAS = [
  { id: "primeiro-passo", icone: "👣", nome: "Primeiro passo", desc: "Responda sua primeira questão" },
  { id: "bloco", icone: "📘", nome: "Bloco concluído", desc: "Termine um bloco de questões" },
  { id: "gabarito", icone: "🏆", nome: "Gabaritou", desc: "Acerte todas as questões de um bloco" },
  { id: "combo", icone: "🔥", nome: "Em chamas", desc: "Acerte 5 questões seguidas" },
  { id: "desafio", icone: "☀️", nome: "Desafio do dia", desc: "Complete o desafio do dia" },
  { id: "simulado", icone: "🎯", nome: "Simulado completo", desc: "Termine o simulado geral" },
  { id: "todas-areas", icone: "🌈", nome: "Todas as áreas", desc: "Responda questões das 5 áreas" },
  { id: "explorador", icone: "🧭", nome: "Explorador", desc: "Descubra sua área na página Faculdade" },
  { id: "leitor", icone: "🔤", nome: "Leitor", desc: "Monte uma palavra com as sílabas" },
  { id: "constancia", icone: "📅", nome: "Constância", desc: "Entre 3 dias seguidos" },
  { id: "redator", icone: "✍️", nome: "Redator", desc: "Envie sua primeira redação" },
  { id: "nota-800", icone: "💯", nome: "Nota 800+", desc: "Tire 800 ou mais na redação" }
];

const chavePerfil = () => "pontoDePartida:perfil:" + (usuario || "visitante").toLowerCase();
function perfilNovo() {
  return {
    momento: null, xp: 0, medalhas: [], feito: {}, letras: [], areas: [], dias: [], desafioFeito: null, mitosVistos: [],
    redacoes: [], ultimaRedacao: null, salvas: [], melhores: {},
    desempenho: Object.fromEntries(Object.keys(AREAS).map(k => [k, { a: 0, t: 0 }]))
  };
}
let perfil = Object.assign(perfilNovo(), ler(chavePerfil(), {}));
const salvarPerfil = () => gravar(chavePerfil(), perfil);

function sequenciaDias() {
  const dias = new Set(perfil.dias);
  let n = 0; const d = new Date();
  while (dias.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function nivelAtual(xp) {
  let i = 0;
  NIVEIS.forEach((n, idx) => { if (xp >= n.min) i = idx; });
  return { i, ...NIVEIS[i], prox: NIVEIS[i + 1] };
}
function ganharXP(qtd) {
  const antes = nivelAtual(perfil.xp).i;
  perfil.xp += qtd;
  const depois = nivelAtual(perfil.xp);
  if (depois.i > antes) celebrar(`Subiu de nível: ${depois.nome}!`);
  salvarPerfil(); atualizarSelo(true);
}
function ganharMedalha(id) {
  if (perfil.medalhas.includes(id)) return;
  perfil.medalhas.push(id);
  const m = MEDALHAS.find(x => x.id === id);
  perfil.xp += 25;
  salvarPerfil();
  celebrar(`${m.icone} Nova medalha: ${m.nome}! +25 XP`);
}

/* Cada página avisa o que a pessoa fez; aqui viram pontos, medalhas e passos da trilha */
function registrar(evento, dados = {}) {
  const f = perfil.feito;
  switch (evento) {
    case "resposta":
      ganharMedalha("primeiro-passo");
      perfil.desempenho[dados.area].t++;
      if (dados.acertou) { perfil.desempenho[dados.area].a++; ganharXP(10); }
      if (dados.seguidas >= 5) ganharMedalha("combo");
      if (!perfil.areas.includes(dados.area)) perfil.areas.push(dados.area);
      if (perfil.areas.length >= Object.keys(AREAS).length) ganharMedalha("todas-areas");
      break;
    case "fim-quiz":
      perfil.melhores[dados.bloco] = Math.max(perfil.melhores[dados.bloco] ?? 0, dados.acertos);
      ganharXP(30);
      if (dados.bloco === "desafio") {
        if (perfil.desafioFeito !== hojeISO()) { perfil.desafioFeito = hojeISO(); ganharXP(40); }
        f.desafio = true; ganharMedalha("desafio");
      } else if (dados.bloco === "simulado") { f.simulado = true; ganharMedalha("simulado"); }
      else { f.bloco = true; ganharMedalha("bloco"); }
      if (dados.acertos === dados.total && dados.total >= 10) { ganharXP(50); ganharMedalha("gabarito"); }
      break;
    case "redacao":
      perfil.redacoes.push({ tema: dados.tema, nota: dados.nota, data: new Date().toLocaleDateString("pt-BR") });
      perfil.ultimaRedacao = dados.nota; f.redacao = true;
      ganharXP(50); ganharMedalha("redator");
      if (dados.nota >= 800) ganharMedalha("nota-800");
      break;
    case "teste": f.teste = true; ganharXP(20); ganharMedalha("explorador"); break;
    case "uf": if (!f.uf) { f.uf = true; ganharXP(10); } break;
    case "letra":
      if (!perfil.letras.includes(dados.letra)) { perfil.letras.push(dados.letra); ganharXP(2); }
      if (perfil.letras.length >= 5) f.letras = true;
      break;
    case "silaba": f.silaba = true; ganharXP(10); ganharMedalha("leitor"); break;
    case "ouvir": f.ouvir = true; ganharXP(5); break;
    case "dica": if (!f.dica) { f.dica = true; ganharXP(5); } break;
    case "facil": f.facil = true; break;
    case "visitou-ler": f["visitou-ler"] = true; break;
    case "mito":
      if (!perfil.mitosVistos.includes(dados.i)) { perfil.mitosVistos.push(dados.i); ganharXP(5); }
      if (perfil.mitosVistos.length >= 3) f.mitos = true;
      break;
  }
  salvarPerfil(); atualizarSelo();
}

/* Áreas do desafio do dia (as mesmas para todo mundo no mesmo dia) */
function sementeDoDia() { return [...hojeISO()].reduce((s, c) => (s * 31 + c.charCodeAt(0)) % 2147483647, 7); }
function areasDoDesafio() {
  const areas = Object.keys(AREAS), s = sementeDoDia();
  return [0, 1, 2].map(k => areas[(s + k * 2) % areas.length]);
}

/* ---------- Cabeçalho e rodapé ---------- */
const MENU = [
  { id: "inicio", href: "inicio.html", icone: "🏠", nome: "Início" },
  { id: "estudar", href: "estudar.html", icone: "📚", nome: "Estudar" },
  { id: "redacao", href: "redacao.html", icone: "✍️", nome: "Redação" },
  { id: "faculdade", href: "faculdade.html", icone: "🎓", nome: "Faculdade" },
  { id: "ler", href: "ler.html", icone: "🔤", nome: "Aprender a ler" },
  { id: "solucoes", href: "solucoes.html", icone: "💡", nome: "Soluções e dicas" }
];
function montarCabecalho() {
  const topo = $("topo");
  if (!topo) return;
  topo.innerHTML = `
    <nav class="container nav" aria-label="Principal">
      <a href="inicio.html" class="logo"><span class="logo-marca" aria-hidden="true"></span>Ponto de Partida</a>
      <ul class="nav-links" id="menu">${MENU.map(m => `
        <li><a href="${m.href}" ${m.id === PAGINA ? 'aria-current="page"' : ""}><span class="icone" aria-hidden="true">${m.icone}</span>${m.nome}</a></li>`).join("")}
      </ul>
      <div class="usuario">
        <a href="perfil.html" class="selo" id="selo" title="Seu perfil: nível, pontos e sequência de dias" ${PAGINA === "perfil" ? 'aria-current="page"' : ""}>
          <span class="avatar-mini" aria-hidden="true">${(usuario || "V").charAt(0)}</span>
          <span id="selo-nivel">Nv. 1</span><span class="selo-xp" id="selo-xp">0 XP</span><span class="selo-fogo">🔥<span id="selo-dias" class="num">0</span></span>
        </a>
        <button class="ferramenta" id="btn-ouvir-pagina" title="Ler esta página em voz alta" aria-label="Ouvir esta página">🔊</button>
        <button class="ferramenta" id="btn-modo-facil" aria-pressed="false" title="Modo fácil: letras maiores" aria-label="Modo fácil">Aa</button>
        <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
      </div>
    </nav>`;
  $("menu-btn").addEventListener("click", () => $("menu-btn").setAttribute("aria-expanded", $("menu").classList.toggle("aberto")));
  $("btn-modo-facil").addEventListener("click", () => definirModoFacil(!document.documentElement.classList.contains("facil")));
  $("btn-ouvir-pagina").addEventListener("click", () => {
    const textos = [...document.querySelectorAll("main [data-ler]")].filter(el => el.offsetParent !== null).map(el => el.textContent.trim());
    falar(textos.join(". ") || document.title);
  });
  atualizarSelo();
}
function montarRodape() {
  const rodape = $("rodape");
  if (rodape) rodape.innerHTML = `<div class="container rodape-grade">
    <span>Ponto de Partida · educação contra a desigualdade</span>
    <span>Questões e textos criados para o site · dados do IBGE (PNAD Contínua Educação 2025) · instituições: confira no e-MEC</span></div>`;
}
function atualizarSelo(pulsar) {
  if (!$("selo")) return;
  const n = nivelAtual(perfil.xp);
  $("selo-nivel").textContent = `Nv. ${n.i + 1}`;
  $("selo-xp").textContent = `${perfil.xp} XP`;
  $("selo-dias").textContent = sequenciaDias();
  if (pulsar) { const s = $("selo"); s.classList.remove("pulsa"); void s.offsetWidth; s.classList.add("pulsa"); }
}

/* ---------- Modo fácil (letras maiores), lembrado entre as páginas ---------- */
function definirModoFacil(ligado) {
  document.documentElement.classList.toggle("facil", ligado);
  if ($("btn-modo-facil")) $("btn-modo-facil").setAttribute("aria-pressed", ligado);
  gravar("pontoDePartida:modoFacil", ligado);
  if (ligado && PAGINA !== "login") registrar("facil");
}

/* ---------- Abas dentro de uma página (ex.: Faculdade) ---------- */
function ativarAbas(aoTrocar) {
  const botoes = [...document.querySelectorAll("[data-aba]")];
  if (!botoes.length) return;
  const mostrar = id => {
    if (!botoes.some(b => b.dataset.aba === id)) id = botoes[0].dataset.aba;
    botoes.forEach(b => b.setAttribute("aria-selected", b.dataset.aba === id));
    document.querySelectorAll("[data-painel]").forEach(p => p.hidden = p.dataset.painel !== id);
    if (aoTrocar) aoTrocar(id);
  };
  botoes.forEach(b => b.addEventListener("click", () => { history.replaceState(null, "", "#" + b.dataset.aba); mostrar(b.dataset.aba); }));
  window.addEventListener("hashchange", () => mostrar(location.hash.slice(1)));
  mostrar(location.hash.slice(1));
}

/* ---------- Desafiar um amigo ---------- */
function caixaDesafiarAmigo(nome, acertos, total) {
  const texto = `Fiz ${acertos}/${total} no ${nome} do Ponto de Partida, um site para estudar para o ENEM de graça. Duvido você me superar!`;
  return `<div class="desafiar">
    <div><h3>Desafie um amigo</h3><p class="suave">Estudar junto ajuda a não desistir. Mande seu resultado e chame alguém para estudar com você.</p></div>
    <div class="linha-botoes">
      <a class="btn btn-whats" href="https://wa.me/?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener">Enviar no WhatsApp</a>
      <button class="btn btn-secundario" data-copiar="${texto.replace(/"/g, "&quot;")}">Copiar mensagem</button>
    </div></div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copiar]");
  if (!b) return;
  try {
    navigator.clipboard.writeText(b.dataset.copiar).then(() => avisar("Mensagem copiada! Cole no app que quiser."), () => avisar("Não foi possível copiar. Selecione o texto e copie manualmente."));
  } catch (err) { avisar("Não foi possível copiar neste navegador."); }
});

/* ---------- Ao abrir qualquer página ---------- */
if (PAGINA !== "login" && usuario) {
  if (!perfil.dias.includes(hojeISO())) perfil.dias.push(hojeISO());
  salvarPerfil();
  montarCabecalho();
  montarRodape();
  if (sequenciaDias() >= 3) ganharMedalha("constancia");
}
if (ler("pontoDePartida:modoFacil", false)) {
  document.documentElement.classList.add("facil");
  if ($("btn-modo-facil")) $("btn-modo-facil").setAttribute("aria-pressed", "true");
}

</script>
<script>
/* ===== js/dados/questoes.js ===== */
/* =========================================================
   BANCO DE QUESTÕES NO ESTILO ENEM (criadas para o Ponto de Partida)
   Formato de cada questão:
   [área, enunciado, alternativa certa, [quatro alternativas erradas], explicação]
   As alternativas são embaralhadas na hora de mostrar.
   Áreas: mat, lin, hum, nat, inf
   ========================================================= */
const QUESTOES = [

/* ===================== MATEMÁTICA (50) ===================== */
["mat", "Uma família pagava R$ 120,00 de conta de luz. No mês seguinte, a conta foi de R$ 150,00. De quanto foi o aumento, em porcentagem?", "25%", ["15%", "20%", "30%", "50%"], "O aumento foi de R$ 30. Como 30 ÷ 120 = 0,25, o aumento foi de 25%."],
["mat", "Em uma escola com 400 alunos, 3 de cada 5 usam transporte público. Quantos alunos usam transporte público?", "240", ["160", "200", "260", "300"], "3/5 de 400 = 400 ÷ 5 × 3 = 80 × 3 = 240."],
["mat", "Um aluno tirou 6, 7 e 8 nas três primeiras provas. Que nota precisa tirar na quarta prova para ficar com média 7,5?", "9", ["7", "8", "8,5", "10"], "Para média 7,5 em 4 provas, a soma precisa ser 30. Ele já tem 21, então falta 9."],
["mat", "Um mapa está na escala 1 : 50.000. Duas cidades estão a 4 cm de distância no mapa. Qual é a distância real?", "2 km", ["0,2 km", "20 km", "200 km", "2.000 km"], "4 cm × 50.000 = 200.000 cm = 2.000 m = 2 km."],
["mat", "Uma caixa-d'água em forma de cubo tem 2 m de aresta. Sabendo que 1 m³ = 1.000 litros, quantos litros ela comporta?", "8.000 L", ["800 L", "4.000 L", "6.000 L", "80.000 L"], "Volume = 2 × 2 × 2 = 8 m³, que equivalem a 8.000 litros."],
["mat", "Um tênis custa R$ 80,00 e está com 15% de desconto. Qual é o preço final?", "R$ 68,00", ["R$ 65,00", "R$ 70,00", "R$ 72,00", "R$ 78,50"], "15% de 80 = 12. Então 80 − 12 = 68."],
["mat", "Uma pessoa pegou R$ 1.000,00 emprestados a juros simples de 2% ao mês, por 6 meses. Quanto pagará só de juros?", "R$ 120,00", ["R$ 12,00", "R$ 60,00", "R$ 200,00", "R$ 1.120,00"], "Juros por mês = 2% de 1.000 = 20. Em 6 meses: 20 × 6 = 120."],
["mat", "Uma receita usa 2 xícaras de farinha para servir 8 pessoas. Quantas xícaras são necessárias para 20 pessoas?", "5", ["4", "4,5", "6", "10"], "Cada xícara serve 4 pessoas. Para 20 pessoas: 20 ÷ 4 = 5 xícaras."],
["mat", "Um terreno retangular mede 12 m por 15 m. Qual é sua área?", "180 m²", ["27 m²", "54 m²", "150 m²", "200 m²"], "Área do retângulo = base × altura = 12 × 15 = 180 m²."],
["mat", "Qual é o perímetro de um quadrado com 7 cm de lado?", "28 cm", ["14 cm", "21 cm", "49 cm", "56 cm"], "O quadrado tem 4 lados iguais: 4 × 7 = 28 cm."],
["mat", "Qual é a raiz quadrada de 144?", "12", ["11", "13", "14", "72"], "12 × 12 = 144."],
["mat", "Qual é o valor de 2³ + 3²?", "17", ["12", "13", "15", "36"], "2³ = 8 e 3² = 9. Então 8 + 9 = 17."],
["mat", "Na equação 3x + 5 = 20, qual é o valor de x?", "5", ["3", "4", "6", "15"], "3x = 20 − 5 = 15, então x = 15 ÷ 3 = 5."],
["mat", "Ao lançar um dado comum de 6 faces, qual é a probabilidade de sair um número par?", "1/2", ["1/6", "1/3", "2/3", "5/6"], "Os pares são 2, 4 e 6: 3 casos em 6 possíveis, ou seja, 3/6 = 1/2."],
["mat", "Uma moeda é lançada duas vezes. Qual é a probabilidade de sair cara nas duas?", "1/4", ["1/2", "1/3", "1/6", "1/8"], "Cada lançamento tem chance 1/2. Nos dois: 1/2 × 1/2 = 1/4."],
["mat", "Um motorista de aplicativo cobra R$ 5,00 fixos mais R$ 2,00 por quilômetro. Quanto custa uma corrida de 8 km?", "R$ 21,00", ["R$ 16,00", "R$ 18,00", "R$ 26,00", "R$ 40,00"], "5 + 2 × 8 = 5 + 16 = 21."],
["mat", "Dada a função f(x) = 2x + 3, qual é o valor de f(4)?", "11", ["8", "9", "10", "14"], "f(4) = 2 × 4 + 3 = 8 + 3 = 11."],
["mat", "Qual é a mediana do conjunto 3, 7, 9, 12, 15?", "9", ["7", "9,2", "12", "15"], "Com os valores em ordem, a mediana é o termo do meio: 9."],
["mat", "Qual é a moda do conjunto 2, 3, 3, 5, 7, 3, 8?", "3", ["2", "5", "7", "8"], "Moda é o valor que mais se repete. O 3 aparece três vezes."],

<script>
/* ===== js/estudar.js ===== */
/* =========================================================
   ESTUDAR: blocos de 10 questões por área, treino aleatório,
   simulado geral e desafio do dia (questões em dados/questoes.js)
   ========================================================= */
const POR_BLOCO = 10;
const questoes = QUESTOES.map(([a, e, certa, erradas, x]) => ({ a, e, certa, erradas, x }));
let areaEstudo = "mat", quiz = null;

/* ---------- Lista de blocos ---------- */
function mostrarBlocos() {
  $("estudar-lista").hidden = false; $("estudar-quiz").hidden = true;
  history.replaceState(null, "", location.pathname);
  const melhores = perfil.melhores;

  const melhorSim = melhores.simulado, feitoHoje = perfil.desafioFeito === hojeISO();
  $("cartoes-destaque").innerHTML = `
    <article class="cartao-bloco destaque">
      <span class="sobretitulo" style="margin:0">Simulado geral</span><h3>20 questões, 4 de cada área</h3>
      <span class="meta">Sorteadas a cada tentativa · ${melhorSim != null ? `Melhor: ${melhorSim} de 20` : "Ainda não feito"}</span>
      <button class="btn" data-bloco="simulado">Fazer simulado</button>
    </article>
    <article class="cartao-bloco destaque-claro">
      <span class="sobretitulo" style="margin:0">☀️ Desafio do dia</span><h3>3 questões rápidas</h3>
      <span class="meta">${feitoHoje ? "Concluído hoje. Volte amanhã!" : "Vale +40 XP extra"}</span>
      <button class="btn btn-primario" data-bloco="desafio">${feitoHoje ? "Refazer" : "Começar"}</button>
    </article>`;

  $("filtros-areas").innerHTML = Object.entries(AREAS).map(([k, area]) => {
    const d = perfil.desempenho[k];
    return `<button class="chip" aria-pressed="${k === areaEstudo}" data-area="${k}">${area.nome}${d.t ? ` <span class="num suave-chip">${Math.round((d.a / d.t) * 100)}%</span>` : ""}</button>`;
  }).join("");
  $("filtros-areas").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { areaEstudo = b.dataset.area; mostrarBlocos(); }));

  const area = AREAS[areaEstudo], daArea = questoes.filter(q => q.a === areaEstudo);
  const cartoes = [];
  for (let n = 0; n < Math.ceil(daArea.length / POR_BLOCO); n++) {
    const chave = `${areaEstudo}-${n}`, ini = n * POR_BLOCO + 1, fim = Math.min((n + 1) * POR_BLOCO, daArea.length);
    const melhor = melhores[chave] != null ? `Melhor: ${melhores[chave]} de ${fim - ini + 1}` : "Ainda não feito";
    cartoes.push(`<article class="cartao-bloco ${melhores[chave] != null ? "feito" : ""}" style="--cor:${area.cor}">
      <span class="sobretitulo" style="margin:0">${area.nome}</span><h3>Bloco ${n + 1}</h3>
      <span class="meta">Questões ${ini} a ${fim} · ${melhor}</span>
      <button class="btn btn-primario" data-bloco="${chave}">${melhores[chave] != null ? "Refazer" : "Começar"}</button></article>`);
  }
  const ma = melhores[`${areaEstudo}-tudo`];
  cartoes.push(`<article class="cartao-bloco" style="--cor:${area.cor}">
      <span class="sobretitulo" style="margin:0">${area.nome}</span><h3>Treino aleatório</h3>
      <span class="meta">10 questões sorteadas · ${ma != null ? `Melhor: ${ma} de 10` : "Ainda não feito"}</span>
      <button class="btn btn-secundario" data-bloco="${areaEstudo}-tudo">Sortear</button></article>`);
  $("grade-blocos").innerHTML = cartoes.join("");
  document.querySelectorAll("#estudar-lista [data-bloco]").forEach(b => b.addEventListener("click", () => iniciarQuiz(b.dataset.bloco)));
}

/* ---------- Montar a lista de questões de cada modo ---------- */
function desafioDeHoje() {
  const s = sementeDoDia();
  return areasDoDesafio().map((area, k) => { const da = questoes.filter(q => q.a === area); return da[(s * (k + 3)) % da.length]; });
}
function montarLista(bloco) {
  if (bloco === "desafio") return desafioDeHoje();
  if (bloco === "simulado") return Object.keys(AREAS).flatMap(k => embaralhar(questoes.filter(q => q.a === k)).slice(0, 4));
  const [area, parte] = bloco.split("-");
  const daArea = questoes.filter(q => q.a === area);
  if (parte === "tudo") return embaralhar(daArea).slice(0, POR_BLOCO);
  return daArea.slice(+parte * POR_BLOCO, (+parte + 1) * POR_BLOCO);
}
function nomeDoBloco(bloco) {
  if (bloco === "desafio") return "Desafio do dia";
  if (bloco === "simulado") return "Simulado geral";
  const [area, parte] = bloco.split("-");
  return `${AREAS[area].nome} · ${parte === "tudo" ? "Treino aleatório" : "Bloco " + (+parte + 1)}`;
}

/* ---------- Responder ---------- */
function iniciarQuiz(bloco) {
  const lista = montarLista(bloco).map(q => { const o = embaralhar([q.certa, ...q.erradas]); return { ...q, o, c: o.indexOf(q.certa) }; });
  quiz = { bloco, lista, i: 0, escolha: null, respostas: [], seguidas: 0 };
  $("estudar-lista").hidden = true; $("estudar-quiz").hidden = false;
  mostrarQuestao(); window.scrollTo(0, 0);
}
function mostrarQuestao() {
  const q = quiz.lista[quiz.i], area = AREAS[q.a];
  $("estudar-quiz").innerHTML = `
    <div class="quiz-topo"><span>${nomeDoBloco(quiz.bloco)} · Questão ${quiz.i + 1} de ${quiz.lista.length}</span>
      <div class="linha-botoes"><button class="ouvir" id="ouvir-questao">🔊 Ouvir questão</button><button class="link-btn" id="sair-quiz">Sair</button></div></div>
    <div class="quiz-barra"><div style="width:${(quiz.i / quiz.lista.length) * 100}%"></div></div>
    <span class="tag" style="border-color:${area.cor};color:${area.cor}">${area.nome}</span>
    <p class="enunciado">${q.e}</p>
    <div class="alternativas">${q.o.map((t, i) => `<button class="alt" data-i="${i}" aria-pressed="false"><span class="letra">${"ABCDE"[i]}</span><span>${t}</span></button>`).join("")}</div>
    <div id="explicacao"></div>
    <div class="quiz-acoes"><button class="btn btn-primario" id="confirmar" disabled>Confirmar resposta</button></div>`;
  quiz.escolha = null;
  document.querySelectorAll(".alt").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".alt").forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true"); quiz.escolha = +b.dataset.i; $("confirmar").disabled = false;
  }));
  $("confirmar").addEventListener("click", confirmarResposta);
  $("sair-quiz").addEventListener("click", mostrarBlocos);
  $("ouvir-questao").addEventListener("click", () => falar(q.e + " " + q.o.map((t, i) => `Letra ${"ABCDE"[i]}: ${t}.`).join(" ")));
}
function confirmarResposta() {
  const q = quiz.lista[quiz.i], acertou = quiz.escolha === q.c;
  quiz.respostas.push(acertou);
  quiz.seguidas = acertou ? quiz.seguidas + 1 : 0;
  registrar("resposta", { acertou, seguidas: quiz.seguidas, area: q.a });
  const alts = document.querySelectorAll(".alt");
  alts.forEach(b => { b.disabled = true; });
  alts[q.c].classList.add("certa");
  if (!acertou) alts[quiz.escolha].classList.add("errada");
  $("explicacao").innerHTML = `<div class="explicacao"><strong>${acertou ? "Você acertou! +10 XP" : `Resposta certa: letra ${"ABCDE"[q.c]}.`}</strong> ${q.x}</div>${quiz.seguidas >= 3 ? `<p class="combo">🔥 ${quiz.seguidas} acertos seguidos!</p>` : ""}`;
  const ultima = quiz.i === quiz.lista.length - 1;
  $("confirmar").outerHTML = `<button class="btn btn-primario" id="proxima">${ultima ? "Ver resultado" : "Próxima questão"}</button>`;
  $("proxima").addEventListener("click", () => { if (ultima) mostrarResultado(); else { quiz.i++; mostrarQuestao(); } });
  $("proxima").focus();
}

/* ---------- Resultado ---------- */
function mostrarResultado() {
  const acertos = quiz.respostas.filter(Boolean).length, total = quiz.lista.length;
  registrar("fim-quiz", { bloco: quiz.bloco, acertos, total });
  const pct = acertos / total;
  const msg = pct === 1 ? "Gabaritou! Que tal tentar o próximo bloco?" : pct >= 0.6 ? "Bom resultado. Revise as que errou e tente de novo." : "Continue treinando. Leia as explicações das questões que errou.";
  let porArea = "";
  if (quiz.bloco === "simulado") {
    porArea = `<div class="barras" style="margin:18px 0">${Object.entries(AREAS).map(([k, area]) => {
      const idx = quiz.lista.map((q, i) => q.a === k ? i : -1).filter(i => i >= 0);
      const ac = idx.filter(i => quiz.respostas[i]).length;
      return `<div class="barra-linha"><span>${area.nome}</span><div class="barra-trilho"><div class="barra-valor" style="width:${(ac / idx.length) * 100}%;background:${area.cor}"></div></div><span class="barra-num num">${ac}/${idx.length}</span></div>`;
    }).join("")}</div>`;
  }
  $("estudar-quiz").innerHTML = `
    <div class="quiz-barra"><div style="width:100%"></div></div>
    <span class="sobretitulo">Resultado · ${nomeDoBloco(quiz.bloco)}</span>
    <p class="resultado-numero num">${acertos}/${total}</p>
    <p style="margin-top:8px">${msg}</p>
    ${porArea}
    <ul class="revisao">${quiz.lista.map((q, i) => `<li><span class="${quiz.respostas[i] ? "ok" : "x"}">${quiz.respostas[i] ? "✓" : "✗"}</span><span>${q.e.length > 110 ? q.e.slice(0, 110) + "…" : q.e}${quiz.respostas[i] ? "" : ` <b>Resposta: ${q.certa}</b>`}</span></li>`).join("")}</ul>
    <div class="linha-botoes"><button class="btn btn-primario" id="refazer">Refazer</button><button class="btn btn-secundario" id="voltar-blocos">Voltar aos blocos</button></div>
    ${caixaDesafiarAmigo(nomeDoBloco(quiz.bloco), acertos, total)}`;
  $("refazer").addEventListener("click", () => iniciarQuiz(quiz.bloco));
  $("voltar-blocos").addEventListener("click", mostrarBlocos);
}

/* Links como estudar.html#desafio ou #simulado já abrem o modo certo */
const pedido = location.hash.slice(1);
if (pedido === "desafio" || pedido === "simulado") iniciarQuiz(pedido);
else { if (AREAS[pedido]) areaEstudo = pedido; mostrarBlocos(); }

</script>
</body>
</html>
